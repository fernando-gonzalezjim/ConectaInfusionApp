# Isolated disposable test service: no host database or persistent volume.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: foundation_test
      POSTGRES_PASSWORD: foundation_test_only
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ["identity"]
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: '@[^@]+\.test$$'
      MP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: "24h"
    networks: ["mailpit_local"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
  flyway:
    image: redgate/flyway:13.9.0
    profiles: ["tools"]
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/foundation_browser
      FLYWAY_USER: foundation_test
      FLYWAY_PASSWORD: foundation_test_only
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    volumes: ["./database/migrations:/flyway/sql:ro"]
networks:
  mailpit_local:
    driver: bridge
