services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conecta_local}
      POSTGRES_DB: ${POSTGRES_DB:-conecta}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ["identity"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: '@[^@]+\.test$$'
      MP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: "24h"
    networks: ["mailpit_local"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
  flyway:
    image: redgate/flyway:13.9.0
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-conecta}
      FLYWAY_USER: ${POSTGRES_USER:-conecta}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-conecta_local}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./database/migrations:/flyway/sql:ro
networks:
  mailpit_local:
    driver: bridge
volumes:
  postgres_data:
