services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta_local
      POSTGRES_DB: conecta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta -d conecta"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
